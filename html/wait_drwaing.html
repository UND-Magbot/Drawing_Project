  <script>
    const video = document.getElementById('camera2');
    navigator.mediaDevices.enumerateDevices()
      .then((devices) => {
        const videoDevices = devices.filter(device => device.kind === 'videoinput');

        if (videoDevices.length === 0) {
          throw new Error('사용 가능한 비디오 입력 장치가 없습니다.');
        }

        // 두 번째 카메라가 있으면 사용, 없으면 첫 번째로 폴백
        const targetDevice = videoDevices[1] || videoDevices[0];

        const constraints = {
          video: {
            deviceId: { ideal: targetDevice.deviceId }
          }
        };

        return navigator.mediaDevices.getUserMedia(constraints);
      })
      .then((stream) => {
        const video = document.getElementById('camera2');
        video.srcObject = stream;
      })
      .catch((err) => {
        console.error('카메라 접근 실패:', err);
      });
  </script>

  <script>
    console.log(path)
    // 오디오 파일의 절대 경로 생성
    const soundPath2 = path.join(__dirname, 'assets', 'sounds', 'DrawingStart.mp3');

    // 브라우저에서 재생 가능한 형식으로 변환
    const audioPath2 = `file://${soundPath2.replace(/\\/g, '/')}`;  // 윈도우 경로 대응
    const previewSound2 = new Audio(audioPath2);

    function handleVolumePreview() {
      const saved = parseFloat(persistentStorage.getItem('appVolume'));
      const value = isFinite(saved) ? Math.max(0, Math.min(1, saved)) : 0.5;
      previewSound2.volume = value;

      try {
        previewSound2.currentTime = 0;
        previewSound2.play();
      } catch (e) {
        console.warn('미리듣기 사운드 재생 실패:', e);
      }

    }

    setTimeout(() => {
      handleVolumePreview();
    }, 1000);
  </script>
  <script>
    // 볼륨 동기화
    window.addEventListener('DOMContentLoaded', () => {
      const savedVolume = persistentStorage.getItem('appVolume');

      if (savedVolume !== null) {
        const volume = parseFloat(savedVolume);
        const introAudio = document.getElementById('introAudio');

        if (introAudio) {
          introAudio.volume = volume;
        }
      }
    });
  </script>
