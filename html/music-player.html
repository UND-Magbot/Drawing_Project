<audio id="bgm" controls autoplay></audio>

<script src="../js/store.js"></script>
<script>
  const fs = require('fs');
  const path = require('path');
  const { ipcRenderer } = require('electron');

  const audio = document.getElementById('bgm');

  const musicDir = "C:/MusicFolder";
  let playlist = [];
  let currentIndex = 0;

  const savedVolume = parseFloat(persistentStorage.getItem('musicVolume'));
  let currentVolume = isNaN(savedVolume) ? 0.5 : savedVolume;

  audio.addEventListener('loadedmetadata', () => {
    audio.volume = currentVolume;
  });

  ipcRenderer.on('set-volume', (event, volume) => {
    currentVolume = volume;
    audio.volume = volume;
    persistentStorage.setItem('musicVolume', volume);
  });

  // ✅ 시작 시 볼륨 요청
  ipcRenderer.send('get-volume');

  if (!fs.existsSync(musicDir)) {
    console.warn(`🎵 음악 폴더가 없습니다: ${musicDir}`);
  } else {
    fs.readdir(musicDir, (err, files) => {
      if (err) {
        console.error("🎵 폴더 읽기 실패:", err);
        return;
      }
      playlist = (files || []).filter(file => file.toLowerCase().endsWith('.mp3'));
      if (playlist.length === 0) {
        console.warn("❗ MP3 파일이 없습니다.");
        return;
      }
      playCurrent();
    });
  }

  function playCurrent() {
    if (!playlist.length) return;
    const songPath = path.join(musicDir, playlist[currentIndex]).replace(/\\/g, '/');
    console.log("▶️ 재생할 곡:", songPath);

    audio.src = `file:///${songPath}`;
    audio.load();
    audio.play().catch(e => console.warn("재생 실패:", e));
  }

  audio.addEventListener('ended', () => {
    if (!playlist.length) return;
    currentIndex = (currentIndex + 1) % playlist.length;
    playCurrent();
  });

  // 재생 중 에러 시 다음 곡으로 스킵
  audio.addEventListener('error', () => {
    if (!playlist.length) return;
    console.warn("재생 오류, 다음 곡으로 이동");
    currentIndex = (currentIndex + 1) % playlist.length;
    setTimeout(playCurrent, 1000);
  });
</script>
